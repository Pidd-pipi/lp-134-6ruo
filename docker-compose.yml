name: gb-134

services:
  db:
    build:
      context: ./database
    image: ${COMPOSE_PROJECT_NAME:-gb-134}-db-image
    container_name: ${COMPOSE_PROJECT_NAME:-gb-134}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5734}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-gb-134}-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-8234}
      CRISIS_HOTLINE: 400-161-9995
      CRISIS_HOTLINE_BACKUP: 010-82951332
    ports:
      - "${BACKEND_PORT:-3234}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-gb-134}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8234}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
